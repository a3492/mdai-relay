name: branch-to-drive
on:
  push:
    branches: ['inbox/**']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Upload to Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          DEST="$(head -n1 DEST.txt | tr -d '\r')"
          case "$DEST" in ""|*..*|/*) echo "bad DEST: $DEST"; exit 1;; esac
          BASE="gdrive:컨텐츠/클로드 컨텐츠/오늘의MDAI_카드뉴스"
          rclone copy payload "$BASE/$DEST"
          test "$(rclone lsf "$BASE/$DEST" | wc -l)" -ge "$(ls payload | wc -l)"
      - name: Delete branch
        run: git push origin --delete "${GITHUB_REF_NAME}"
